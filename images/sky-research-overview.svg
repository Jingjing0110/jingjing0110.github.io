<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="research-overview-title research-overview-desc" style="--motif-water:#678698;--motif-health:#806d94;--motif-resource:#66816f">
  <title id="research-overview-title">Two connected perspectives on wastewater</title>
  <desc id="research-overview-desc">Wastewater provides health information through wastewater surveillance, supported by pathogen detection, assay validation, and microbial analysis. It also provides recoverable resources through sustainable resource recovery, evaluated using process modeling, life cycle assessment, and techno-economic analysis.</desc>
  <defs>
