  <g fill="#302d35">
    <text x="344" y="229" fill="#726080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="1.2">RECOVERABLE RESOURCES</text>
    <text x="344" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="25">Sustainable resource recovery</text>
    <text x="344" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Process modeling · Life cycle assessment</text>
    <text x="344" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Techno-economic analysis</text>
