      </g>
    </symbol>
  </defs>
  <g fill="none" stroke="#b4a0bf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M154 175H193Q207 175 207 161V98Q207 84 221 84H261" marker-end="url(#research-overview-arrow)" />
