      <path d="M1 1 8 5 1 9" fill="none" stroke="#b4a0bf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <symbol id="sky-motif-water" viewBox="0 0 64 64">
      <g fill="none" stroke="var(--motif-water, #809eae)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 7c-5 9-13 17-13 27a13 13 0 0 0 26 0C45 24 37 16 32 7Z" />
        <path d="M25 34c0 5 3 8 7 9" />
        <path d="M7 53c8-3 16-3 24 0s16 3 26 0M14 60c6-2 12-2 18 0s12 2 18 0" />
      </g>
    </symbol>
    <symbol id="sky-motif-surveillance" viewBox="0 0 64 64">
