    <text x="82" y="112" fill="#726080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="0.8">HEALTH INFORMATION</text>
    <text x="82" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="25">Wastewater</text>
    <text x="82" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="25">surveillance</text>
    <text x="82" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Pathogen detection</text>
    <text x="82" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Assay validation</text>
    <text x="82" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Microbial analysis</text>
  </g>
  <path d="M82 282H369" stroke="#ded8e2" stroke-width="1" />
  <g fill="#302d35">
    <text x="82" y="310" fill="#726080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" letter-spacing="0.8">RECOVERABLE RESOURCES</text>
    <text x="82" y="343" font-family="Georgia, 'Times New Roman', serif" font-size="25">Sustainable</text>
    <text x="82" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="25">resource recovery</text>
    <text x="82" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Process modeling</text>
    <text x="82" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Life cycle assessment</text>
    <text x="82" y="453" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Techno-economic analysis</text>
  </g>
  <use href="#sky-motif-surveillance" x="54" y="91" width="22" height="22" />
  <use href="#sky-motif-resource-recovery" x="54" y="289" width="22" height="22" />
