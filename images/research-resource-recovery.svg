<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="recovery-title recovery-desc">
  <title id="recovery-title">An integrated framework for coastal nutrient management</title>
  <desc id="recovery-desc">Coastal nutrient management is the challenge, illustrated by a Boothbay Harbor case study comparing water resource recovery facility upgrades with bioextractive macroalgae aquaculture. Two parallel strategies, macroalgae bioextraction and wastewater treatment, feed an integrated evaluation to support nutrient-management decisions. Cultivation includes two scenarios, four platforms, and four biomass end uses. Treatment spans 0.1 to 20 million US gallons per day, twelve technologies, three nutrient effluent goals, and freshwater or coastal discharge. Integrated evaluation spans 0.1 to 5 million US gallons per day, four facility scenarios, five mixed scenarios, and three nutrient effluent goals. All parts use scenario design, process modeling, life cycle assessment, and techno-economic analysis.</desc>
