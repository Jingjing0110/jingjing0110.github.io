<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1070" viewBox="0 0 390 1070" role="img" aria-labelledby="recovery-mobile-title recovery-mobile-desc">
  <title id="recovery-mobile-title">An integrated framework for coastal nutrient management</title>
  <desc id="recovery-mobile-desc">Coastal nutrient management is the challenge, illustrated by a Boothbay Harbor case study comparing water resource recovery facility upgrades with bioextractive macroalgae aquaculture. Two parallel strategies, macroalgae bioextraction and wastewater treatment, join in integrated evaluation to support nutrient-management decisions. Cultivation covers two scenarios, four platforms, and four biomass end uses. Treatment covers 0.1 to 20 million US gallons per day, twelve technologies, three nutrient goals, and freshwater or coastal discharge. Integrated evaluation covers 0.1 to 5 million US gallons per day, four facility scenarios, five mixed scenarios, and three nutrient goals. Common methods are scenario design, process modeling, life cycle assessment, and techno-economic analysis.</desc>
