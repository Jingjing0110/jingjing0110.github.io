<aside class="profile" aria-label="About {{ site.author.name | escape }}">
        <div class="portrait-frame">
          <img class="portrait" src="{{ site.author.avatar | prepend: "/images/" | relative_url }}" width="800" height="800" alt="{{ site.author.name | escape }}" fetchpriority="high">
        </div>
        <div class="profile-intro">
          <p class="profile-name">{{ site.author.name }}</p>
          <p class="profile-role">{{ site.author.role }}</p>
          <p class="profile-affiliation">{{ site.author.department }}<br>{{ site.author.employer }}</p>
          <p class="profile-location">{{ site.author.location }}</p>
        </div>
        <ul class="profile-links">
          <li><a href="mailto:{{ site.author.email }}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>Email<span class="link-arrow" aria-hidden="true">↗</span></a></li>
          <li><a href="{{ site.author.googlescholar }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5-10-5Zm5 3v5c3 2 7 2 10 0v-5M22 9v7"/></svg>Google Scholar<span class="link-arrow" aria-hidden="true">↗</span></a></li>
          <li><a href="{{ site.author.orcid }}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 10v7m0-10v.1M12 7v10h2a5 5 0 0 0 0-10h-2Z"/></svg>ORCID<span class="link-arrow" aria-hidden="true">↗</span></a></li>
          <li><a href="{{ site.author.researchgate }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V4h6a4 4 0 0 1 0 8H5m6 0 7 8M16 5h5m-2.5-2.5v5"/></svg>ResearchGate<span class="link-arrow" aria-hidden="true">↗</span></a></li>
        </ul>
        <p class="profile-note">Connecting environmental engineering with public health.</p>
      </aside>
